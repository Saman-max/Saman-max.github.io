<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title"><title id="title">留学网申助手功能流程图</title><defs><radialGradient id="glow" cx=".9" cy=".1" r="1"><stop stop-color="#cfb17d" stop-opacity=".13"/><stop offset="1" stop-color="#cfb17d" stop-opacity="0"/></radialGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#cfb17d" stroke-width="1.3"/></marker></defs><rect width="720" height="520" rx="16" fill="#141219"/><rect width="720" height="520" rx="16" fill="url(#glow)"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="34" y="40" font-size="13" fill="#cfb17d" letter-spacing="2">01 / SKIPAPPLICATION</text><text x="34" y="87" font-size="34" fill="#eee8ef" >留学网申助手</text><path d="M34 112H686" stroke="#cfb17d" stroke-opacity=".2"/><rect x="38" y="148" width="275" height="105" rx="12" fill="#cfb17d" fill-opacity=".07" stroke="#cfb17d" stroke-opacity=".4"/><text x="56" y="173" font-size="14" fill="#cfb17d" >01</text><text x="175.5" y="203.5" font-size="27" fill="#eee8ef" text-anchor="middle" font-weight="500">整理申请资料</text><text x="175.5" y="231.5" font-size="15" fill="#cfb17d" text-anchor="middle">文件与可复用信息库</text><rect x="406" y="148" width="275" height="105" rx="12" fill="#cfb17d" fill-opacity=".07" stroke="#cfb17d" stroke-opacity=".4"/><text x="424" y="173" font-size="14" fill="#cfb17d" >02</text><text x="543.5" y="203.5" font-size="27" fill="#eee8ef" text-anchor="middle" font-weight="500">扫描页面字段</text><text x="543.5" y="231.5" font-size="15" fill="#cfb17d" text-anchor="middle">浏览器插件识别表单</text><rect x="406" y="321" width="275" height="105" rx="12" fill="#cfb17d" fill-opacity=".07" stroke="#cfb17d" stroke-opacity=".4"/><text x="424" y="346" font-size="14" fill="#cfb17d" >03</text><text x="543.5" y="376.5" font-size="27" fill="#eee8ef" text-anchor="middle" font-weight="500">匹配已有信息</text><text x="543.5" y="404.5" font-size="15" fill="#cfb17d" text-anchor="middle">本地规则 + LLM</text><rect x="38" y="321" width="275" height="105" rx="12" fill="#cfb17d" fill-opacity=".07" stroke="#cfb17d" stroke-opacity=".4"/><text x="56" y="346" font-size="14" fill="#cfb17d" >04</text><text x="175.5" y="376.5" font-size="27" fill="#eee8ef" text-anchor="middle" font-weight="500">确认并回填</text><text x="175.5" y="404.5" font-size="15" fill="#cfb17d" text-anchor="middle">核对候选资料后填写</text><path d="M323 200H392" fill="none" stroke="#cfb17d" stroke-width="2" stroke-opacity=".7" marker-end="url(#arrow)"/><path d="M544 264V307" fill="none" stroke="#cfb17d" stroke-width="2" stroke-opacity=".7" marker-end="url(#arrow)"/><path d="M396 373H328" fill="none" stroke="#cfb17d" stroke-width="2" stroke-opacity=".7" marker-end="url(#arrow)"/><text x="34" y="489" font-size="15" fill="#cfb17d" >信息复用 → 字段匹配 → 用户确认 → 辅助填写</text><text x="686" y="489" font-size="11" fill="#cfb17d" text-anchor="end" letter-spacing="2">WORKFLOW</text></g></svg>